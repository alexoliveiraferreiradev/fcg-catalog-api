name: CI/CD Fiap Cloud Games - Catalog Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   
  contents: read
  
env:
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 9.0.x
  SOLUTION: Fcg.Catalog.slnx
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name:  Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore 
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore
      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      - name: ACR Login 
        run: az acr login --name ${{ vars.ACR_REGISTRY_NAME }}

      - name: Build and Push Docker Image to ACR
        run: |
          IMAGE_TAG=fcg-catalog-api:${{ github.sha }}
          docker build -t ${{ vars.ACR_REGISTRY_NAME }}.azurecr.io/$IMAGE_TAG .
          docker push ${{ vars.ACR_REGISTRY_NAME }}.azurecr.io/$IMAGE_TAG
  
