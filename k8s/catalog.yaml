apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-catalog-api-deployment
  labels:
    app: fcg-catalog-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fcg-catalog-api
  template:
    metadata:
      labels: 
        app: fcg-catalog-api
      annotations:
        autor: Alex O Ferreira
        description: "Deployment do microsservico de Catalogo API do Fiap Cloud Games"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - fcg-catalog-api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: c-fcg-catalog-api
        image: acrfiapcloudgames.azurecr.io/fcg-catalog-api:1.3
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        env:
          - name: DatabaseSettings__Host
            valueFrom:
              configMapKeyRef:
                name: catalog-config
                key: DB_SERVER
          - name: DatabaseSettings__DatabaseName
            valueFrom:
              configMapKeyRef:
                name: catalog-config
                key: DB_NAME
          - name: DatabaseSettings__Port
            valueFrom:
              configMapKeyRef:
                name: catalog-config
                key: DB_PORT          
          - name: DatabaseSettings__Username
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: DB_USER
          - name: DatabaseSettings__Password
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: DB_PASS
          - name: ASPNETCORE_ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: catalog-config
                key: ENVIRONMENT
          - name: AzureServiceBus__ConnectionString
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: ServiceBus_Connection
          - name: RedisSettings__Host
            valueFrom:
              configMapKeyRef:
                name: catalog-config
                key: REDIS_SERVER
          - name: RedisSettings__Port
            valueFrom:
              configMapKeyRef:
                name: catalog-config
                key: REDIS_PORT
          - name: RedisSettings__InstanceName
            valueFrom:
              configMapKeyRef:
                name: catalog-config
                key: REDIS_NAME
          - name: RedisSettings__Password
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: REDIS_PASSWORD
          - name: JwtSettings__Issuer
            valueFrom:
              configMapKeyRef:
                name: catalog-config
                key: JWT_ISSUER
          - name: JwtSettings__Audience
            valueFrom:
              configMapKeyRef:
                name: catalog-config
                key: JWT_AUDIENCE
          - name: JwtSettings__Secret
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: JWT_SECRET
        volumeMounts:
          - name: secrets-store
            mountPath: /mnt/secrets
            readOnly: true        
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
          - name: secrets-store
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: fcg-kv
---
apiVersion: v1
kind: Service
metadata:
  name: svc-fcg-catalog-api
spec:
  type: ClusterIP
  selector:
    app: fcg-catalog-api
  ports:
    - port: 8084
      targetPort: 8080
