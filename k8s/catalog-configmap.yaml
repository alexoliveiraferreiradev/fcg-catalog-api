apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  annotations:
    # Ordem do sync: ConfigMap (-2) → migração (-1) → Deployment/Service (0).
    argocd.argoproj.io/sync-wave: "-2"
data:
  DB_SERVER: sql-service
  DB_PORT: "1433"
  DB_NAME: "Fcg_Catalogs"
  REDIS_SERVER: redis-service
  REDIS_PORT: "6379" 
  REDIS_NAME: "FiapCloudGames:" 
  ENVIRONMENT: "Development"
  JWT_ISSUER: "FiapCloudGames"
  JWT_AUDIENCE: "FiapCloudGamesAudience"