apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fcg-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "96939283-57f6-481b-9c40-3da5eef51b72"
    keyvaultName: kv-fcg-techchallenge
    tenantId: "852f1c35-6183-431f-b141-737c3bfeecc3"
    objects: |
      array:
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: mssql-sa-password
          objectType: secret
        - |
          objectName: db-user
          objectType: secret
        - |
          objectName: redis-password
          objectType: secret
        - |
          objectName: mongo-db-user
          objectType: secret
        - |
          objectName: mongo-password
          objectType: secret
        - |
          objectName: servicebus-apis-connection
          objectType: secret
        - |
          objectName: grafana-password
          objectType: secret
        - |
          objectName: apikey-elasticsearch
          objectType: secret
        - |
          objectName: cloudId-elasticsearch
          objectType: secret
        - |
          objectName: elasticsearch-url
          objectType: secret
  secretObjects:
    - secretName: fcg-secrets
      type: Opaque
      data:
        - objectName: jwt-secret
          key: JWT_SECRET
        - objectName: mssql-sa-password
          key: DB_PASS
        - objectName: db-user
          key: DB_USER
        - objectName: redis-password
          key: REDIS_PASSWORD
        - objectName: mongo-db-user
          key: MONGO_USER
        - objectName: mongo-password
          key: MONGO_PASSWORD
        - objectName: servicebus-apis-connection
          key: ServiceBus_Connection
        - objectName: grafana-password
          key: GRAFANA_PASSWORD
        - objectName: apikey-elasticsearch
          key: ELASTICSEARCH_APIKEY
        - objectName: cloudId-elasticsearch
          key: ELASTICSEARCH_CLOUD_ID
        - objectName: elasticsearch-url
          key: ELASTICSEARCH_URL
